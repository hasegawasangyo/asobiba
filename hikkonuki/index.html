<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飛脚もぐら ひっこぬき（ゲーム試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a2f1f;
    --board: #d7a36a;
    --board-edge: #8a5a36;
    --board-text: #3f2616;
    --paper: #fff8ec;
    --sky: #cde8f4;
    --btn: #3fa9e0;
    --btn-edge: #1f6f99;
    --btn-bg: rgba(255, 248, 236, 0.92);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sky: #9fc7da; --paper: #fff3e0; }
  }
  :root[data-theme="dark"] { --sky: #9fc7da; --paper: #fff3e0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .sign {
    position: absolute; left: max(12px, env(safe-area-inset-left, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    background: var(--board); color: var(--board-text);
    border: 3px solid var(--board-edge); border-radius: 10px;
    padding: 6px 14px 8px; box-shadow: 0 3px 0 var(--board-edge);
    font-family: "Mochiy Pop One", "Zen Maru Gothic", sans-serif;
    font-size: clamp(14px, 2.2vw, 21px); line-height: 1.25; pointer-events: none;
  }
  .sign small { display: block; font-family: "Zen Maru Gothic", sans-serif; font-weight: 700; font-size: 0.62em; opacity: 0.8; }
  .hud {
    position: absolute; right: max(12px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: flex; align-items: center; gap: 10px;
  }
  .count {
    background: var(--board); color: var(--board-text);
    border: 3px solid var(--board-edge); border-radius: 10px; box-shadow: 0 3px 0 var(--board-edge);
    padding: 5px 14px 7px; display: flex; align-items: baseline; gap: 8px; pointer-events: none;
    font-weight: 700; font-size: clamp(13px, 1.8vw, 17px);
  }
  .count b { font-family: "Mochiy Pop One", sans-serif; font-weight: 400; font-size: 1.9em; line-height: 1; min-width: 1.2em; text-align: right; display: inline-block; }
  .count b.bump { animation: bump 0.35s ease-out; }
  @keyframes bump { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #mute {
    width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--board-edge);
    background: var(--btn-bg); color: var(--board-text); cursor: pointer; padding: 0;
    display: grid; place-items: center; box-shadow: 0 3px 0 var(--board-edge);
  }
  #mute svg { width: 24px; height: 24px; }
  #mute .off { display: none; }
  #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: inline; }
  button:focus-visible { outline: 3px solid #1f6f99; outline-offset: 3px; }

  .panel {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(255, 248, 236, 0.18);
  }
  .panel[hidden] { display: none; }
  .card {
    background: var(--paper); color: var(--ink);
    border: 4px solid var(--board-edge); border-radius: 20px; box-shadow: 0 6px 0 var(--board-edge);
    padding: clamp(16px, 3.5vw, 28px) clamp(16px, 4vw, 36px); text-align: center; max-width: 36em;
  }
  .card h1 { margin: 0 0 0.35em; font-family: "Mochiy Pop One", sans-serif; font-weight: 400; font-size: clamp(24px, 5.2vw, 40px); line-height: 1.2; }
  .card p { margin: 0 0 1em; font-size: clamp(15px, 2.4vw, 19px); font-weight: 700; line-height: 1.6; }
  .card .big { font-family: "Mochiy Pop One", sans-serif; font-weight: 400; font-size: clamp(18px, 3vw, 24px); margin: 0; }
  .card .big b { font-weight: 400; font-size: 2.6em; color: #c9761e; margin: 0 0.1em; }
  .card .rank { display: inline-block; margin: 0.3em 0 0.4em; padding: 0.15em 0.9em; border-radius: 99px; background: var(--board); border: 3px solid var(--board-edge);
    font-family: "Mochiy Pop One", sans-serif; font-weight: 400; font-size: clamp(20px, 4vw, 30px); color: var(--board-text); }
  .card { max-height: calc(100% - 8px); overflow-y: auto; }
  .card h1 { white-space: nowrap; }
  .card .lead { margin-bottom: 0.7em; }
  .guide { display: grid; gap: 8px; margin: 0 auto 16px; text-align: left; }
  .guide .row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 14px; border: 2px solid; }
  .guide .ok { background: #e9f8e2; border-color: #7cc36a; }
  .guide .ng { background: #fde9e4; border-color: #e07a66; }
  .guide .icons { display: flex; gap: 2px; flex: none; }
  .guide .ico { width: 44px; height: 44px; }
  .guide .mark { font-family: "Mochiy Pop One", sans-serif; font-size: 26px; line-height: 1; flex: none; }
  .guide .ok .mark { color: #3f9d2e; }
  .guide .ng .mark { color: #d23c2c; }
  .guide .txt { font-weight: 700; font-size: clamp(13px, 2vw, 16px); line-height: 1.4; }
  .guide .txt b { display: block; font-family: "Mochiy Pop One", sans-serif; font-weight: 400; font-size: 1.12em; }
  .guide .ok b { color: #2f7d22; }
  .guide .ng b { color: #c2331f; }
  .guide .txt small { display: block; font-size: 0.82em; opacity: 0.85; }
  @media (max-width: 420px) { .guide .ico { width: 36px; height: 36px; } .guide .mark { font-size: 22px; } }
  @media (max-height: 460px) { .card h1 { margin-bottom: 0.15em; } .card .lead { display: none; } .guide { gap: 5px; margin-bottom: 10px; } .guide .ico { width: 36px; height: 36px; } }
  .card .warn { color: #b8412f; font-size: clamp(14px, 2.2vw, 17px); margin-top: -0.5em; }
  .count.minus { animation: minus 0.5s ease-out; }
  @keyframes minus { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); background: #f0a090; } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .card .bossline { font-family: "Mochiy Pop One", sans-serif; font-size: clamp(15px, 2.5vw, 19px); margin-top: -0.3em; }
  .card .bossline.won { color: #d2761b; }
  .card .bossline.lost { color: #6b6f86; }
  .count.catch { animation: catch 0.3s ease-out; }
  @keyframes catch { 0% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .card .note { font-size: clamp(14px, 2.2vw, 17px); }
  .go {
    font-family: "Mochiy Pop One", sans-serif; font-size: clamp(18px, 3.2vw, 24px); color: #fff;
    background: var(--btn); border: 3px solid var(--btn-edge); border-radius: 16px; box-shadow: 0 5px 0 var(--btn-edge);
    padding: 0.45em 1.6em; cursor: pointer;
  }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-edge); }
  @media (prefers-reduced-motion: reduce) { .count b.bump { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="飛脚もぐらを上に引っぱって抜くゲーム"></canvas>
  <div class="sign">飛脚もぐら ひっこぬき<small>ゲーム試作</small></div>
  <div class="hud">
    <div class="count" id="countBox">仲間<b id="cnt">0</b></div>
    <button id="mute" type="button" aria-pressed="false" aria-label="音を消す">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>
  <div class="panel" id="titlePanel">
    <div class="card">
      <h1>飛脚もぐら ひっこぬき</h1>
      <p class="lead">日が暮れるまでに、もぐらを引っこ抜いて仲間を集めよう</p>
      <div class="guide" aria-label="あそびかた">
        <div class="row ok"><span class="icons"><canvas class="ico" data-k="mole" aria-hidden="true"></canvas><canvas class="ico" data-k="gold" aria-hidden="true"></canvas></span><span class="mark">〇</span><span class="txt">丸い時計が消える前に<b>押して抜く！</b><small>金・銀の笠は すぐ消えるけど 仲間がたくさん</small></span></div>
        <div class="row ng"><span class="icons"><canvas class="ico" data-k="frog" aria-hidden="true"></canvas><canvas class="ico" data-k="hedgehog" aria-hidden="true"></canvas><canvas class="ico" data-k="snake" aria-hidden="true"></canvas></span><span class="mark">✕</span><span class="txt">もぐら以外の動物は<b>押しちゃダメ！</b><small>押すと 仲間が2匹にげちゃう</small></span></div>
      </div>
      <button class="go" id="startBtn" type="button">はじめる</button>
    </div>
  </div>
  <div class="panel" id="resultPanel" hidden>
    <div class="card">
      <p class="big">今日の仲間<b id="rNum">0</b>匹</p>
      <div class="rank" id="rRank">町飛脚</div>
      <p class="note" id="rNote"></p>
      <p class="bossline" id="rBoss"></p>
      <button class="go" id="againBtn" type="button">もう一回</button>
    </div>
  </div>
</div>

  if (p > 0.5) { g.strokeStyle = `rgba(255,255,255,${(p - 0.5) * 1.6})`; g.lineWidth = 3; g.beginPath(); g.arc(x, y, r * (2.4 - p), 0, Math.PI * 2); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,0.95)'; g.strokeStyle = '#4a2f1f'; g.lineWidth = 3;
  g.beginPath(); g.arc(x, y - (1 - p) * Hm * 0.05, r, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(63,169,224,0.9)'; g.beginPath(); g.arc(x, y - (1 - p) * Hm * 0.05, r * 0.45, 0, Math.PI * 2); g.fill();
  const size = Math.max(16, Hm * 0.12);
  g.font = `${Math.round(size)}px ${fontPop}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  const ty = ht.boss ? bossRing().y - bossRing().r - size : ringOf(ht.h).y - ringOf(ht.h).r - size * 0.9;
  g.lineWidth = size * 0.28; g.strokeStyle = '#fff'; g.strokeText(label, x, ty); g.fillStyle = '#4a2f1f'; g.fillText(label, x, ty);
  g.restore();
}
function drawAnimalIn(g, h) {
  const m = h.mole, A = ANIMAL[m.type], U = h.Hm;
  g.save(); holeClip(g, h);
  g.translate(h.x + (m.shakeX || 0), h.y + (1 - m.reveal) * A.H * U); g.rotate(m.tilt || 0); g.scale(U, U * m.sy);
  DRAW_ANIMAL[m.type](g, { t: now, seed: m.seed, angry: m.state === 'angry' || (m.state === 'duck' && m.angry), at: m.t });
  g.restore();
}

const backdrop = document.createElement('canvas'); let bdKey = '';
function renderBackdrop(u, finaleScene) {
  const key = (finaleScene ? 'F' : 'P') + Math.round(u * 250) + '_' + cv.width + 'x' + cv.height;
  if (key === bdKey) return;
  bdKey = key;
  if (backdrop.width !== cv.width || backdrop.height !== cv.height) { backdrop.width = cv.width; backdrop.height = cv.height; }
  const g = backdrop.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky(g, u);
  g.drawImage(finaleScene ? groundFinale : groundPlay, 0, 0, cw, ch);
  const eve = finaleScene ? 0.2 : clamp((u - 0.55) / 0.45, 0, 1) * 0.2;
  if (eve > 0) { g.fillStyle = `rgba(255,130,50,${eve})`; g.fillRect(0, horizon - ch * 0.08, cw, ch); }
}
function frame(ts) {
  try { frameBody(ts); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function frameBody(ts) {
  const t = ts / 1000;
  const dt = Math.min(0.05, Math.max(0, t - (frame.last || t)));
  frame.last = t; now += dt;

  updateGame(dt); updateSpawner(); updateHoles(dt); updateBoss(dt);
  if (S.mode === 'play') { const rem = PLAY_SEC - S.elapsed; MUSIC.bpm = 116 + 14 * skyU() + (rem < 10 ? (10 - rem) * 5 : 0); }   // 残り10秒から一気に速く
  else if (MUSIC.pattern === 'tension' && boss) MUSIC.bpm = boss.started ? 140 + 80 * (1 - boss.left / boss.limit) : 112;
  S.beat = (S.beat || 0) + dt * MUSIC.bpm / 60;
  if (AC) while (MUSIC.events.length && MUSIC.events[0].time <= AC.currentTime) onBeat(MUSIC.events.shift());
  updateActors(dt); updateMembers(dt); updateAmbient(dt); updateFx(dt);

  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  let ox = 0, oy = 0;
  if (shake > 0) { shake -= dt; const a = Math.min(1, shake / 0.18) * Math.min(cw, ch) * 0.008; ox = rand(-a, a); oy = rand(-a, a); }
  g.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);
  const u = skyU();
  const finaleScene = S.mode === 'finale' || S.mode === 'result';
  renderBackdrop(u, finaleScene);                 // 空と地面は、時間が少し進んだときだけ描き直す（毎回描くと重いため）
  g.drawImage(backdrop, 0, 0, cw, ch);
  AMB.crows.forEach(c => drawCrow(g, c)); AMB.runners.forEach(r => drawRunner(g, r));

  const items = [];
  if (!finaleScene) holes.forEach(h => {
    const m = h.mole; if (!m || m.reveal <= 0.001) return;
    items.push({ y: h.y, draw: () => { if (m.animal) drawAnimalIn(g, h); else { g.save(); holeClip(g, h); drawMole(g, holePose(h)); g.restore(); } } });
  });
  if (finaleScene && boss && boss.state !== 'gone' && boss.reveal > 0.001) items.push({ y: bossHole.y, draw: () => { g.save(); holeClip(g, bossHole); drawMole(g, bossPose()); g.restore(); } });
  actors.forEach(a => {
    if (a.phase === 'wait' || a.phase === 'hud' || a.phase === 'zoom') return;
    if (a.phase === 'boss') {
      const y = a.bphase === 'fly' ? a.landY : a.fy;
      items.push({ y: y + 0.01, draw: () => { drawShadow(g, a.cx || a.fx, a.landY, 0.34 * W0 * bossHole.s); if (a.bphase === 'fly' && a.vy < 0 && a.cy + 0.5 * a.len * a.sy > bossHole.y) { g.save(); holeClip(g, bossHole); drawMole(g, bossActorPose(a)); g.restore(); } else drawMole(g, bossActorPose(a)); } });
      return;
    }
    const footY = a.phase === 'fly' ? a.landY : a.phase === 'roll' ? a.cy + 1 : a.fy;
    items.push({ y: footY + 0.001, draw: () => {
      const p = actorPose(a);
      if (a.phase === 'fly') { const hgt = clamp((a.landY - (a.cy + 0.5 * a.len)) / a.hole.Hm, 0, 2); if (a.cy + 0.5 * a.len < a.hole.y) drawShadow(g, a.cx, a.landY, 0.34 * W0 * a.s * (1 - hgt * 0.3), 0.2 * (1 - hgt * 0.35)); }
      else if (a.phase !== 'roll') drawShadow(g, toWorld(p, AX, H0 / 2)[0], a.fy, 0.34 * W0 * a.s * (a.tipped ? 1.3 : 1));
      if (a.phase === 'fly' && a.cy + 0.5 * a.len * a.sy + 4 > a.hole.y && a.vy < 0) { g.save(); holeClip(g, a.hole); drawMole(g, p); g.restore(); }
      else drawMole(g, p);
    } });
  });
  const fin = S.mode === 'finale' || S.mode === 'result';
  if (fin) squad.forEach(q => {
    const p = squadPose(q);
    items.push({ y: q.y, draw: () => {
      drawShadow(g, q.x, q.y, 0.3 * W0 * p.s, 0.2);
      drawMole(g, p);
      drawFlags(g, q);
      if (RARE_N[q.mb.type]) {
        const [bx, by] = toWorld(p, 560, 60), fs = Math.max(11, H0 * p.s * 0.2), lab = '×' + RARE_N[q.mb.type];
        g.font = `${Math.round(fs)}px ${fontPop}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
        g.lineWidth = fs * 0.28; g.strokeStyle = '#fff'; g.strokeText(lab, bx, by); g.fillStyle = q.mb.type === 'gold' ? '#c9761e' : '#6b7a92'; g.fillText(lab, bx, by);
      }
    } });
  });
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
  AMB.bugs.forEach(b => b.kind === 'lady' ? drawLadybug(g, b) : drawButterfly(g, b));
  fx.forEach(p => drawFx(g, p));
  drawRings(g);
  if (fin && boss && (boss.state === 'rest' || boss.state === 'snap')) {   // 親方：丸＝残り時間、中の数字＝あと何回
    const rg = bossRing();
    drawRing(g, rg.x, rg.y, rg.r, boss.left / boss.limit, !boss.started);
    const fs = Math.round(rg.r * 0.8);
    g.font = `${fs}px ${fontPop}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.lineWidth = fs * 0.3; g.strokeStyle = '#fff'; g.strokeText(String(boss.needed - boss.level), rg.x, rg.y + fs * 0.05);
    g.fillStyle = '#4a2f1f'; g.fillText(String(boss.needed - boss.level), rg.x, rg.y + fs * 0.05);
    const ls = Math.max(12, rg.r * 0.45); g.font = `${Math.round(ls)}px ${fontPop}`;
    g.lineWidth = ls * 0.3; g.strokeText('あと', rg.x - rg.r - ls * 1.3, rg.y); g.fillText('あと', rg.x - rg.r - ls * 1.3, rg.y);
    g.strokeText('回', rg.x + rg.r + ls * 0.9, rg.y); g.fillText('回', rg.x + rg.r + ls * 0.9, rg.y);
  }
  actors.forEach(a => { if (a.phase === 'hud' || a.phase === 'zoom') drawMole(g, actorPose(a)); });
  fleers.forEach(f => drawMole(g, fleerPose(f)));
  drawHint(g);
  texts.forEach(s => drawText(g, s));
  if (S.fade > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(255,170,110,${S.fade})`; g.fillRect(0, 0, cv.width, cv.height); }
}

/* ================= 起動 ================= */
let started = false;
function drawGuideIcons() {   // タイトルの「あそびかた」の小さな絵
  document.querySelectorAll('canvas.ico').forEach(c => {
    const k = c.dataset.k, S_ = 52, d = Math.min(window.devicePixelRatio || 1, 2.5);
    c.width = S_ * d; c.height = S_ * d; const g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, S_, S_);
    if (k === 'mole' || k === 'gold') {
      const sx = 40, sw = 520, sh = 400, k2 = S_ / sw;   // 笠と顔のあたりを切り出す
      g.drawImage(IMG.face, sx, 0, sw, sh, 0, S_ - sh * k2, S_, sh * k2);
      if (k === 'gold') g.drawImage(IMG.gold, sx, 0, sw, HAT_H, 0, S_ - sh * k2, S_, HAT_H * k2);
    } else { g.save(); g.translate(S_ / 2, S_ * 0.98); const sc = S_ * (k === 'snake' ? 0.98 : 1.1); g.scale(sc, sc); DRAW_ANIMAL[k](g, { t: 1.2, seed: 0.4, angry: false, at: 0 }); g.restore(); }
  });
}
function start() {
  if (started) return; started = true;
  layout(); drawGuideIcons();
  spawnIn(holes[3], 'normal', { noTimeout: true, delay: 0.2 }); spawnIn(holes[1], 'sleep', { noTimeout: true, delay: 0.5 });
  requestAnimationFrame(frame);
}
const imgs = Object.values(IMG); let loaded = 0;
imgs.forEach(im => { if (im.complete && im.naturalWidth) loaded++; else im.onload = () => { if (++loaded === imgs.length) start(); }; });
if (loaded === imgs.length) start();
if (window.ResizeObserver) new ResizeObserver(() => { if (started) { layout(); if (S.mode === 'finale' || S.mode === 'result') layoutSquad(); drawGuideIcons(); } }).observe(stage);
else window.addEventListener('resize', () => { if (started) layout(); });
window.__mogura = { S, get holes() { return holes; }, get actors() { return actors; }, get members() { return members; }, get boss() { return boss; }, get bossHole() { return bossHole; },
  get amb() { return AMB; }, spawnIn: (i, type) => spawnIn(holes[i], type), ringOf: i => ringOf(holes[i]), critterTop: i => critterTop(holes[i]), get squad() { return squad; }, audio: () => ({ AC, master, MUSIC }) };
})();
