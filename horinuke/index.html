<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ほりぬけ（試作）</title>
<style>
  :root{ --bg:#2b1d12; --accent:#1fb5b0; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:relative;margin:0 auto;}
  canvas{display:block;width:100%;height:100%;border-radius:10px;
    box-shadow:0 6px 30px rgba(0,0,0,.5);cursor:none;}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;color:#fff;background:rgba(30,20,10,.66);
    padding-bottom:140px !important;}
  #titleOv{background:linear-gradient(rgba(30,20,10,.55),rgba(30,20,10,.25) 70%,rgba(30,20,10,0));}
  #titleOv h1{font-size:40px;}
    border-radius:10px;gap:14px;padding:16px;box-sizing:border-box;}
  .ov h1{margin:0;font-size:30px;letter-spacing:.08em;text-shadow:0 2px 0 #000;}
  .ov p{margin:0;font-size:15px;line-height:1.7;}
  .ov .big{font-size:20px;}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:999px;
    padding:12px 34px;font-size:19px;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #0f7471;font-family:inherit;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f7471;}
  .hide{display:none;}
  .note{font-size:12px;opacity:.75;}
  .legend{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;text-align:left;
    background:rgba(0,0,0,.25);padding:10px 14px;border-radius:10px;}
  .legend b{color:#ffd86a;}
  .btn.sub{background:#8d6e63;box-shadow:0 4px 0 #5d4037;font-size:15px;padding:9px 24px;}
  .stages{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .stages button{border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer;
    background:#f6ead2;color:#3a2a1a;font-family:inherit;}
  .stages button.lock{opacity:.35;cursor:default;}
  .stages button.cur{outline:3px solid var(--accent);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div class="ov" id="titleOv">
    <h1>ほりぬけ</h1>
    <p class="big">棒でボールを打ち返して<br>土をぜんぶ掘ろう！</p>
    <div class="legend">
      <span><b>笠</b> 棒がのびる</span><span><b>小包</b> ボールがふえる</span>
      <span><b>書状</b> ゆっくりになる</span><span><b>ハート</b> 一つ回復</span>
      <span><b>ヘビ</b> びっくりして固まる</span><span><b>ハリネズミ</b> チクッ、棒がちぢむ</span>
      <span><b>カエル</b> ぬるぬる、動きが重い</span><span></span>
    </div>
    <p>マウス（指）を左右に動かす／クリック（タップ）で打ち出す</p>
    <div class="stages" id="stageBtns"></div>
    <button class="btn" id="startBtn">1面から はじめる</button>

  </div>

  <div class="ov hide" id="clearOv">
    <h1 id="clearTitle">ぜんぶ掘った！</h1>
    <p class="big" id="clearMsg"></p>
    <button class="btn" id="nextBtn">つぎの面へ</button>
    <button class="btn sub" id="againBtn1">もう一回</button>
  </div>

  <div class="ov hide" id="overOv">
    <h1>あちゃー</h1>
    <p class="big" id="overMsg"></p>
    <button class="btn" id="againBtn2">もう一回</button>
    <button class="btn sub" id="titleBtn">表紙へ</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ===== 盤面の寸法（論理座標） ===== */
const W = 400, H = 760;
const HUD = 44;
const SKY = 120;
const COLS = 10, BW = W / COLS;   // 40
const MAX_ROWS = 16, BH = 22;
let ROWS = 16;
const SOIL_TOP = SKY;
let SOIL_BOTTOM = SOIL_TOP + ROWS * BH;
const PADDLE_Y = H - 116;
const BALL_R = 15;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const wrap = document.getElementById("wrap");
let scale = 1, dpr = 1;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const totalH = H + HUD;
  scale = Math.min(window.innerWidth / W, window.innerHeight / totalH) * 0.98;
  const cw = Math.floor(W * scale), ch = Math.floor(totalH * scale);
  wrap.style.width = cw + "px"; wrap.style.height = ch + "px";
  wrap.style.marginTop = Math.max(0, (window.innerHeight - ch) / 2) + "px";
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);
}
window.addEventListener("resize", resize);
resize();

/* ===== 音 ===== */
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function tone(freq, dur, type="sine", vol=0.15, slide=0){
  const a = audio(); if(!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
function noise(dur, vol=0.12, hp=800){
  const a = audio(); if(!a) return;
  const t = a.currentTime, len = Math.floor(a.sampleRate*dur);
  const buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=hp; f.Q.value=0.8;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const SE = {
  paddle(){ tone(520,0.08,"triangle",0.16); },
  wall(){ tone(300,0.05,"triangle",0.07); },
  dig(){ noise(0.09,0.22,500+Math.random()*300); },
  hard(){ tone(180,0.07,"square",0.06); noise(0.05,0.1,1500); },
  item(){ tone(660,0.08,"sine",0.15); setTimeout(()=>tone(990,0.12,"sine",0.15),70); },
  bad(){ tone(220,0.25,"sawtooth",0.08,-120); },
  miss(){ tone(400,0.4,"sawtooth",0.07,-260); },
  clear(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.25,"triangle",0.16),i*110)); }
};

function drawImg(img, cx, cy, h, rot){ // 高さ h で中心に描く
  if(!img || !img.complete || !img.naturalWidth) return false;
  const w = img.naturalWidth * h / img.naturalHeight;
  ctx.save(); ctx.translate(cx, cy); if(rot) ctx.rotate(rot); ctx.drawImage(img, -w/2, -h/2, w, h); ctx.restore();
  return true;
}

/* ===== 土の種類 =====
   1=やわらか土（突き抜けて掘れる） 2=かたい土（2回） 3=石（3回） 5=荷物（やわらか＋何か落ちる） */
const HP = {1:1, 2:2, 3:3, 5:1};
const PASS = {1:true, 5:true};

/* ===== 落ちてくる物 ===== */
const DROPS = [
  {k:"kasa",   label:"笠",       good:true,  color:"#e9c46a", w:3},
  {k:"kozutsumi", label:"小包", good:true,  color:"#2a9d8f", w:3},
  {k:"shojo",  label:"書状",     good:true,  color:"#f4f1de", w:3},
  {k:"heart",  label:"ハート",   good:true,  color:"#ff5d8f", w:3},
  {k:"hebi",   label:"ヘビ",     good:false, color:"#6a994e", w:3},
  {k:"hari",   label:"ハリネズミ", good:false, color:"#8d6e63", w:3},
  {k:"kaeru",  label:"カエル",   good:false, color:"#80b918", w:3},
];
let itemsOpened = 0, heartGiven = 0;
function pickDrop(){
  itemsOpened++;
  const heart = DROPS.find(d=>d.k==="heart");
  const needHeart = lives < 3;
  // のこりが減っていて、後半（6個目以降）までハートが出ていなければ必ずハート
  if(needHeart && heartGiven===0 && itemsOpened>=6){ heartGiven++; return heart; }
  const st = stage();
  const pool = DROPS.filter(d => (d.k!=="heart" || needHeart) && (d.good || st.bad));
  const wOf = d => d.good ? d.w : d.w*st.badW;
  const total = pool.reduce((a,d)=>a+wOf(d),0);
  let r = Math.random()*total, pick = pool[0];
  for(const d of pool){ r -= wOf(d); if(r<=0){ pick = d; break; } }
  if(pick.k==="heart") heartGiven++;
  return pick;
}

/* ===== 面 =====
   theme: under=地中 / ground=地上
   mix: [やわらか, かたい, 石] の割合（深さで少し変わる）
   shape: 形の名前  bad: 困る物を出すか  badW: 困る物の重み倍率 */
const STAGES = [
  {no:1, name:"やわらかい土",   theme:"under",  rows:12, shape:"holes",   mix:[0.80,0.17,0.03], bad:false, badW:0,   items:8,  speed:300},
  {no:2, name:"石まじりの土",   theme:"under",  rows:16, shape:"full",    mix:[0.60,0.30,0.10], bad:true,  badW:1,   items:10, speed:330},
  {no:3, name:"かたい地層",     theme:"under",  rows:16, shape:"pattern", mix:[0.40,0.40,0.20], bad:true,  badW:1.4, items:10, speed:350},
  {no:4, name:"地上の荷物の山", theme:"ground", rows:14, shape:"piles",   mix:[0.55,0.30,0.15], bad:true,  badW:1.2, items:10, speed:350},
];
let stageIdx = 0;
function stage(){ return STAGES[stageIdx]; }
function unlocked(){ try{ return Math.max(1, parseInt(localStorage.getItem("horinuke_unlocked")||"1",10)); }catch(e){ return 1; } }
function unlock(n){ try{ if(n>unlocked()) localStorage.setItem("horinuke_unlocked", String(n)); }catch(e){} }

// 形：そのマスに土があるか
function shapeHas(shape, r, c, rows){
  if(shape==="full") return true;
  if(shape==="holes") return !((r%3===1) && (c%4===2));                 // ところどころ穴
  if(shape==="pattern"){                                                 // 上半分は山形、下半分は市松の帯
    if(r < rows/2){ const mid = (COLS-1)/2; return Math.abs(c-mid) <= r + 0.5; }
    return !(r%2===0 && c%2===1);
  }
  if(shape==="piles"){                                                   // 荷物の山：3つの山（下ほど広い）
    const piles=[[1.5,rows-2,1.6],[5,rows,2.2],[8.5,rows-4,1.6]];
    return piles.some(([cx,h,maxw]) => { const k = r-(rows-h); return k>=0 && Math.abs(c-cx) <= Math.min(maxw, k*0.35+0.5); });
  }
  return true;
}

function makeGrid(){
  const st = stage();
  ROWS = st.rows; SOIL_BOTTOM = SOIL_TOP + ROWS*BH;
  const g = [];
  for(let r=0;r<ROWS;r++){
    const row = [];
    const depth = r / (ROWS-1);                 // 0=上（地表側） 1=下
    for(let c=0;c<COLS;c++){
      if(!shapeHas(st.shape, r, c, ROWS)){ row.push({t:0, hp:0, flash:0, seed:Math.random()}); continue; }
      // 上ほど固い：深さで「やわらか」の割合を上下させる
      const soft = Math.min(0.95, st.mix[0] + (depth-0.5)*0.4);
      const hard = st.mix[1] * (1 - soft) / (st.mix[1]+st.mix[2] || 1);
      const p = Math.random(); let t;
      if(p < soft) t = 1; else if(p < soft + hard) t = 2; else t = 3;
      row.push({t, hp: HP[t], flash:0, seed: Math.random()});
    }
    g.push(row);
  }
  const filled = []; for(let r=1;r<ROWS;r++) for(let c=0;c<COLS;c++) if(g[r][c].t) filled.push([r,c]);
  let placed = 0, tries = 0;
  while(placed < st.items && tries < 500 && filled.length){
    tries++;
    const [r,c] = filled[Math.floor(Math.random()*filled.length)];
    if(g[r][c].t !== 5){ g[r][c] = {t:5, hp:1, flash:0, seed:Math.random()}; placed++; }
  }
  return g;
}

function reset(){
  grid = makeGrid();
  balls = []; drops = []; parts = [];
  paddle = {x: W/2, w: 120, wideT: 0, shortT:0, freezeT:0, slipT:0, targetX: W/2, face:"normal", faceT:0};
  lives = 3; timeSec = 0; shake = 0; msgTimer = 0; msgText = ""; missed = 0;
  slowT = 0; lastSpurt = false; lastHitT = 0; drillT = 0; combo = 0; comboT = 0; itemsOpened = 0; heartGiven = 0;
  decor = makeDecor();
  holdBall();
  state = "play";
  if(stage().theme==="ground"){
    showMsg(stage().no + "面　" + stage().name);
    for(let i=0;i<60;i++) parts.push({x:Math.random()*W, y:SKY-20+Math.random()*30, vx:(Math.random()*2-1)*80, vy:-Math.random()*120, life:0.8+Math.random()*0.6, size:3+Math.random()*3, color:i%3? "#8f5c39":"#7ccd5a"});
  } else showMsg(stage().no + "面　" + stage().name);
}

function speedNow(){
  const up = Math.min(1, timeSec/120) * 70;
  return (stage().speed + up) * (slowT>0 ? 0.65 : 1);
}
function paddleW(){
  let w = paddle.w;
  if(paddle.wideT>0) w *= 1.4;
  if(paddle.shortT>0) w *= 0.68;
  return w;
}

function holdBall(){
  balls = [{x: paddle.x, y: PADDLE_Y - BALL_R - 1, vx:0, vy:0, held:true, trail:[], rot:0}];
}
function launch(){
  for(const b of balls){
    if(b.held){
      b.held = false; lastHitT = timeSec;
      const ang = (Math.random()*30 - 15) * Math.PI/180, s = speedNow();
      b.vx = Math.sin(ang)*s; b.vy = -Math.cos(ang)*s;
      tone(440,0.06,"triangle",0.12);
    }
  }
}

/* ===== 入力 ===== */
function toLocalX(clientX){ const r = cv.getBoundingClientRect(); return (clientX - r.left) / r.width * W; }
cv.addEventListener("pointermove", e => { if(state==="play") paddle.targetX = toLocalX(e.clientX); });
cv.addEventListener("pointerdown", e => { audio(); if(state!=="play") return; paddle.targetX = toLocalX(e.clientX); launch(); });
const keys = {};
window.addEventListener("keydown", e => { keys[e.key]=true; if(e.key===" "||e.key==="ArrowUp"){ audio(); if(state==="play") launch(); e.preventDefault(); } });
window.addEventListener("keyup", e => { keys[e.key]=false; });

/* ===== 当たり ===== */
function cellAt(x, y){
  if(y < SOIL_TOP || y >= SOIL_BOTTOM || x < 0 || x >= W) return null;
  const c = Math.floor(x / BW), r = Math.floor((y - SOIL_TOP) / BH);
  const cell = grid[r][c];
  return cell.t ? {r, c, cell} : null;
}
function showMsg(t){ msgText = t; msgTimer = 1.1; }

// 戻り値 true=跳ね返す
function hitCell(h){
  const {r, c, cell} = h;
  cell.flash = 0.12;
  const pass = !!PASS[cell.t] || drillT > 0;
  if(drillT > 0) cell.hp = 0; else cell.hp--;
  const cx = c*BW+BW/2, cy = SOIL_TOP+r*BH+BH/2;
  if(cell.hp <= 0){
    lastHitT = timeSec;
    const wasItem = cell.t === 5, col = soilColor(cell.t, r);
    cell.t = 0;
    SE.dig();
    shake = Math.min(4, shake + (pass ? 0.8 : 1.5));
    spawnParts(cx, cy, pass ? 6 : 9, col);
    if(wasItem) drops.push({x:cx, y:cy, vy:95, kind:pickDrop(), wob:Math.random()*6.28});
    combo++; comboT = 0.6;
    if(combo === 6){ showMsg("いっきに掘った！"); setFace("joy", 1.0); }
    return !pass;
  }
  SE.hard();
  spawnParts(cx, cy, 4, soilColor(cell.t, r));
  return true;
}
function setFace(f, t){ paddle.face = f; paddle.faceT = t; }

function stepBall(b, dt){
  if(b.held){ b.x = paddle.x; b.y = PADDLE_Y - BALL_R - 1; return; }
  const sp = Math.hypot(b.vx, b.vy);
  const steps = Math.max(1, Math.ceil(sp*dt / (BALL_R*0.5)));
  const sdt = dt/steps;
  for(let i=0;i<steps;i++){
    b.x += b.vx*sdt;
    if(b.x < BALL_R){ b.x = BALL_R; b.vx = Math.abs(b.vx); SE.wall(); }
    if(b.x > W-BALL_R){ b.x = W-BALL_R; b.vx = -Math.abs(b.vx); SE.wall(); }
    {
      const ex = b.x + Math.sign(b.vx)*BALL_R;
      const h = cellAt(ex, b.y) || cellAt(ex, b.y-BALL_R*0.7) || cellAt(ex, b.y+BALL_R*0.7);
      if(h && hitCell(h)){ b.vx = -b.vx; b.x += b.vx*sdt; }
    }
    b.y += b.vy*sdt;
    if(b.y < SKY + BALL_R){ b.y = SKY + BALL_R; b.vy = Math.abs(b.vy); SE.wall(); }
    {
      const ey = b.y + Math.sign(b.vy)*BALL_R;
      const h = cellAt(b.x, ey) || cellAt(b.x-BALL_R*0.7, ey) || cellAt(b.x+BALL_R*0.7, ey);
      if(h && hitCell(h)){ b.vy = -b.vy; b.y += b.vy*sdt; }
    }
    const pw = paddleW();
    if(b.vy > 0 && b.y + BALL_R >= PADDLE_Y - 6 && b.y + BALL_R <= PADDLE_Y + 12 &&
       b.x > paddle.x - pw/2 - BALL_R && b.x < paddle.x + pw/2 + BALL_R){
      const off = Math.max(-1, Math.min(1, (b.x - paddle.x) / (pw/2)));
      const ang = off * 62 * Math.PI/180, s = speedNow();
      b.vx = Math.sin(ang)*s; b.vy = -Math.cos(ang)*s;
      b.y = PADDLE_Y - 6 - BALL_R;
      SE.paddle();
      if(paddle.face==="normal" || paddle.face==="hit") setFace("hit", 0.25);
      combo = 0;
    }
    if(Math.abs(b.vy) < 60){
      b.vy = (b.vy<0?-1:1)*60;
      const s = speedNow(), vxs = Math.sign(b.vx)||1;
      b.vx = vxs*Math.sqrt(Math.max(0, s*s - 3600));
    }
  }
  const s = speedNow(), cur = Math.hypot(b.vx,b.vy) || 1;
  b.vx *= s/cur; b.vy *= s/cur;
  b.rot += (b.vx>0?1:-1) * dt * 6;
  b.trail.push({x:b.x, y:b.y}); if(b.trail.length>6) b.trail.shift();
}

/* ===== 落ちてきた物を受けたとき ===== */
function catchDrop(d){
  const k = d.kind.k;
  if(d.kind.good) SE.item(); else SE.bad();
  if(k==="kasa"){ paddle.wideT = 15; paddle.shortT = 0; showMsg("笠！ 棒がのびた"); setFace("hit",0.8); }
  if(k==="kozutsumi"){ showMsg("小包！ ボールがふえた"); setFace("hit",0.8); multiBall(); }
  if(k==="shojo"){ slowT = 10; showMsg("書状！ ゆっくり"); setFace("hit",0.8); }
  if(k==="heart"){ lives = Math.min(3, lives+1); showMsg("ハート！ 一つ回復"); setFace("love",1.4); }
  if(k==="hebi"){ paddle.freezeT = 2.0; showMsg("ヘビ！ びっくり"); setFace("surprise",2.0); }
  if(k==="hari"){ paddle.shortT = 10; paddle.wideT = 0; showMsg("ハリネズミ！ チクッ"); setFace("ouch",1.2); }
  if(k==="kaeru"){ paddle.slipT = 6; showMsg("カエル！ ぬるぬる"); setFace("dizzy",6); }
}
function multiBall(){
  const src = balls.find(b=>!b.held) || balls[0];
  if(src.held){ src.held=false; src.vx=0; src.vy=-speedNow(); }
  for(const d of [-25, 25]){
    const s = speedNow(), a = Math.atan2(src.vx, -src.vy) + d*Math.PI/180;
    balls.push({x:src.x, y:src.y, vx:Math.sin(a)*s, vy:-Math.abs(Math.cos(a)*s), held:false, trail:[], rot:0});
  }
}

function spawnParts(x, y, n, color){
  for(let i=0;i<n;i++) parts.push({x, y, vx:(Math.random()*2-1)*120, vy:-Math.random()*140-20,
      life:0.5+Math.random()*0.4, size:2+Math.random()*3, color});
}

/* ===== 更新 ===== */
function remaining(){ let n=0; for(const row of grid) for(const c of row) if(c.t) n++; return n; }
function totalCells(){ return ROWS*COLS; }
function fmtTime(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return m+"分"+String(r).padStart(2,"0")+"秒"; }

function update(dt){
  if(state!=="play") return;
  timeSec += dt;
  for(const k of ["wideT","shortT","freezeT","slipT"]) if(paddle[k]>0) paddle[k]-=dt;
  if(slowT>0) slowT -= dt;
  if(drillT>0) drillT -= dt;
  if(paddle.faceT>0){ paddle.faceT -= dt; if(paddle.faceT<=0) paddle.face="normal"; }
  if(msgTimer>0) msgTimer -= dt;
  if(comboT>0){ comboT -= dt; if(comboT<=0) combo = 0; }
  shake = Math.max(0, shake - dt*18);

  if(keys["ArrowLeft"])  paddle.targetX -= 420*dt;
  if(keys["ArrowRight"]) paddle.targetX += 420*dt;
  const pw = paddleW();
  paddle.targetX = Math.max(pw/2, Math.min(W-pw/2, paddle.targetX));
  if(paddle.freezeT <= 0){
    const ease = paddle.slipT>0 ? 3.5 : 22;
    paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt*ease);
  }

  for(const b of balls) stepBall(b, dt);

  // 飛脚が時々、空を飛んでいく
  if(hik.active){
    hik.x += hik.dir * 150 * dt;
    if(hik.x < -80 || hik.x > W+80){ hik.active=false; hik.next = 8 + Math.random()*12; }
  }else{
    hik.next -= dt;
    if(hik.next <= 0){ hik.active=true; hik.dir = Math.random()<0.5 ? 1 : -1; hik.x = hik.dir>0 ? -70 : W+70; hik.y = 36 + Math.random()*30; }
  }

  const rem = remaining();
  if(rem === 0) return doClear();
  if(rem <= 6 && !lastSpurt){
    lastSpurt = true;
    for(const row of grid) for(const c of row) if(c.t && c.t!==5){ c.t = 1; c.hp = 1; }
    showMsg("あと少し！");
  }
  if(balls.some(b=>!b.held) && drillT<=0 && timeSec - lastHitT > 12){
    lastHitT = timeSec; drillT = 8; SE.item(); showMsg("お助けドリル！"); setFace("surprise",1.2);
  }

  const before = balls.length;
  balls = balls.filter(b => b.y - BALL_R < H + 10);
  if(balls.length === 0 && before > 0){
    lives--; missed++; SE.miss();
    setFace("oops", 1.6); showMsg("あちゃー");
    if(lives <= 0) return doOver();
    holdBall();
  }

  for(const d of drops){ d.y += d.vy*dt; d.wob += dt*4; }
  drops = drops.filter(d => {
    if(d.y > PADDLE_Y-16 && d.y < PADDLE_Y+16 && Math.abs(d.x - paddle.x) < paddleW()/2 + 14){
      catchDrop(d); return false;
    }
    return d.y < H + 20;
  });

  for(const p of parts){ p.life -= dt; p.vy += 520*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  parts = parts.filter(p => p.life > 0);
  for(const row of grid) for(const c of row) if(c.flash>0) c.flash -= dt;
}

function doClear(){
  state = "clear"; SE.clear();
  const last = stageIdx >= STAGES.length-1;
  unlock(stage().no + (last ? 0 : 1));
  document.getElementById("clearTitle").textContent = last ? "ぜんぶの面をクリア！" : (stage().no + "面 クリア！");
  document.getElementById("clearMsg").innerHTML = "かかった時間　" + fmtTime(timeSec) + "<br>落としたボール　" + missed + "回" +
    (last ? "" : "<br><br>つぎは " + STAGES[stageIdx+1].no + "面「" + STAGES[stageIdx+1].name + "」");
  document.getElementById("nextBtn").classList.toggle("hide", last);
  setTimeout(()=>document.getElementById("clearOv").classList.remove("hide"), 900);
  for(let i=0;i<80;i++) parts.push({x:Math.random()*W, y:-10-Math.random()*60, vx:(Math.random()*2-1)*40,
      vy:Math.random()*60, life:3+Math.random()*2, size:4+Math.random()*3,
      color:["#f2b33d","#e86a5a","#1fb5b0","#ffffff","#9bd46a"][i%5], confetti:true});
}
function doOver(){
  state = "over";
  const done = totalCells() - remaining(), pct = Math.round(done/totalCells()*100);
  document.getElementById("overMsg").innerHTML = stage().no + "面　のこり " + remaining() + " マス<br>（" + pct + "% まで掘れた）";
  setTimeout(()=>document.getElementById("overOv").classList.remove("hide"), 700);
}

/* ===== 描画 ===== */
function soilColor(t, r){
  const d = r/(ROWS-1);
  if(stage().theme==="ground"){ if(t===3) return "#6b4a2c"; if(t===2) return "#b07a45"; return "#e2bb62"; }
  if(t===1 || t===5) return mix("#c98a5b","#a86a44",d);
  if(t===2) return mix("#a0633e","#7d4a2c",d);
  if(t===3) return "#9aa0a6";
  return "#000";
}
function mix(a,b,t){
  const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)), pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));
  return "rgb(" + pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",") + ")";
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function makeDecor(){
  const flowers=[]; for(let i=0;i<9;i++) flowers.push({x:14+i*44+Math.random()*20, c:["#ff8fa3","#ffd166","#fff","#c9a7ff","#ff6b6b"][i%5], s:0.8+Math.random()*0.5});
  const clouds=[]; for(let i=0;i<3;i++) clouds.push({x:Math.random()*W, y:16+Math.random()*26, s:0.7+Math.random()*0.6, v:5+Math.random()*5});
  const birds=[]; for(let i=0;i<3;i++) birds.push({x:Math.random()*W, y:22+Math.random()*30, v:14+Math.random()*10, ph:Math.random()*6.28});
  const trees=[]; for(let i=0;i<6;i++) trees.push({x:18+i*72+Math.random()*30, h:22+Math.random()*14, w:16+Math.random()*10, c:["#4f9a3c","#5fae49","#3f8a35"][i%3]});
  const pebbles=[]; for(let i=0;i<40;i++) pebbles.push({x:Math.random()*W, y:SKY+Math.random()*(H-SKY), r:1.5+Math.random()*2.5, a:0.05+Math.random()*0.08});
  const roots=[]; for(let i=0;i<5;i++) roots.push({x:30+i*80+Math.random()*30, sway:(Math.random()-0.5)*60, len:160+Math.random()*120});
  return {flowers, clouds, birds, trees, pebbles, roots};
}

function drawSky(hy, full){
  const g = ctx.createLinearGradient(0,0,0,hy); g.addColorStop(0,"#6ec6f0"); g.addColorStop(0.7,"#bfe8fb"); g.addColorStop(1,"#e9f7ff");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,full ? H : hy);

  const sg = ctx.createRadialGradient(340,30,4,340,30,40); sg.addColorStop(0,"rgba(255,245,200,1)"); sg.addColorStop(0.35,"rgba(255,230,140,.9)"); sg.addColorStop(1,"rgba(255,230,140,0)");
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(340,30,40,0,6.28); ctx.fill();
  // 遠くの山（富士のような高い山と連なる山並み）
  ctx.fillStyle="#9fbfd9";
  ctx.beginPath(); ctx.moveTo(0,hy-30); ctx.lineTo(40,hy-48); ctx.lineTo(80,hy-36); ctx.lineTo(120,hy-56); ctx.lineTo(160,hy-40); ctx.lineTo(200,hy-74); ctx.lineTo(240,hy-40); ctx.lineTo(290,hy-52); ctx.lineTo(330,hy-36); ctx.lineTo(370,hy-46); ctx.lineTo(400,hy-32); ctx.lineTo(400,hy); ctx.lineTo(0,hy); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#f4fbff"; ctx.beginPath(); ctx.moveTo(200,hy-74); ctx.lineTo(188,hy-62); ctx.lineTo(195,hy-60); ctx.lineTo(202,hy-64); ctx.lineTo(209,hy-60); ctx.lineTo(214,hy-62); ctx.closePath(); ctx.fill();
  // 丘（奥・手前）
  ctx.fillStyle="#8fcf6a"; ctx.beginPath(); ctx.moveTo(0,hy-16); ctx.quadraticCurveTo(70,hy-40,150,hy-20); ctx.quadraticCurveTo(230,hy-2,300,hy-24); ctx.quadraticCurveTo(360,hy-40,400,hy-18); ctx.lineTo(400,hy); ctx.lineTo(0,hy); ctx.closePath(); ctx.fill();
  // 木
  for(const t of decor.trees){
    ctx.fillStyle="#7a4a2a"; ctx.fillRect(t.x-2, hy-10-t.h*0.5, 4, t.h*0.5+2);
    ctx.fillStyle=t.c; ctx.beginPath(); ctx.arc(t.x, hy-12-t.h*0.55, t.w*0.55, 0, 6.28); ctx.arc(t.x-t.w*0.35, hy-8-t.h*0.4, t.w*0.42, 0, 6.28); ctx.arc(t.x+t.w*0.35, hy-8-t.h*0.4, t.w*0.42, 0, 6.28); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)"; ctx.beginPath(); ctx.arc(t.x-t.w*0.15, hy-16-t.h*0.55, t.w*0.25, 0, 6.28); ctx.fill();
  }
  // 家（瓦屋根の小さな家）
  const hx=250, hhy=hy-10;
  ctx.fillStyle="#f3e9d2"; ctx.fillRect(hx-18,hhy-20,36,20);
  ctx.fillStyle="#5a3e2b"; ctx.beginPath(); ctx.moveTo(hx-25,hhy-20); ctx.lineTo(hx,hhy-36); ctx.lineTo(hx+25,hhy-20); ctx.closePath(); ctx.fill();
  ctx.fillStyle="#8a6a4a"; ctx.fillRect(hx-5,hhy-12,10,12); ctx.fillStyle="#9fd3e8"; ctx.fillRect(hx+7,hhy-16,7,6); ctx.fillRect(hx-15,hhy-16,7,6);
  // 鳥
  ctx.strokeStyle="#3b4a5a"; ctx.lineWidth=1.6;
  for(const b of decor.birds){
    const bx=((b.x + timeSec*b.v) % (W+40)) - 20, f=Math.sin(timeSec*6+b.ph)*3;
    ctx.beginPath(); ctx.moveTo(bx-6,b.y); ctx.quadraticCurveTo(bx-3,b.y-3-f,bx,b.y); ctx.quadraticCurveTo(bx+3,b.y-3-f,bx+6,b.y); ctx.stroke();
  }
  // 雲
  ctx.fillStyle="#fff"; ctx.globalAlpha=.92;
  for(const c of decor.clouds){ const cx=((c.x + timeSec*c.v) % (W+80)) - 40; ctx.beginPath(); ctx.ellipse(cx,c.y,26*c.s,10*c.s,0,0,6.28); ctx.ellipse(cx+20*c.s,c.y-4,16*c.s,9*c.s,0,0,6.28); ctx.ellipse(cx-18*c.s,c.y-2,14*c.s,8*c.s,0,0,6.28); ctx.fill(); }

    ctx.fillStyle="#c98f55"; ctx.fillRect(x+3,y+3,BW-6,BH*0.42); ctx.fillStyle="#a56f3c"; ctx.fillRect(x+3,y+3+BH*0.45,BW-6,BH*0.42);
    ctx.strokeStyle="#5e3a1c"; ctx.lineWidth=2; ctx.strokeRect(x+2,y+2,BW-4,BH-4);
    ctx.fillStyle="#4a2e14"; for(const [nx,ny] of [[x+6,y+6],[x+BW-7,y+6],[x+6,y+BH-7],[x+BW-7,y+BH-7]]){ ctx.beginPath(); ctx.arc(nx,ny,1.4,0,6.28); ctx.fill(); }
  }else{ // 俵（荷物入りも）
    const g=ctx.createLinearGradient(0,y,0,y+BH); g.addColorStop(0,"#f0cf7a"); g.addColorStop(1,"#c9a24e");
    ctx.fillStyle=g; roundRect(x+1,y+1,BW-2,BH-2,9); ctx.fill();
    ctx.strokeStyle="rgba(120,80,20,.35)"; ctx.lineWidth=1;
    for(let k=0;k<5;k++){ const ly=y+4+k*(BH-8)/4; ctx.beginPath(); ctx.moveTo(x+6,ly); ctx.lineTo(x+BW-6,ly+ (hash(sd,k)-0.5)*2); ctx.stroke(); }
    ctx.fillStyle="#8d5b2a"; ctx.fillRect(x+11,y+1,3,BH-2); ctx.fillRect(x+BW-14,y+1,3,BH-2);
    if(t===5) drawImg(DIMG.kozutsumi, x+BW/2, y+BH/2+1, BH-4, 0);
  }
  const rr = t===3 ? 7 : (t===2 ? 2 : 9);
  ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=1; roundRect(x+1,y+1,BW-2,BH-2,rr); ctx.stroke();
  if((t===2||t===3) && cell.hp < HP[t]){
    ctx.strokeStyle="rgba(20,8,0,.8)"; ctx.lineWidth=1.8; ctx.beginPath();
    ctx.moveTo(x+8,y+4); ctx.lineTo(x+16,y+11); ctx.lineTo(x+13,y+18);
    if(HP[t]-cell.hp>=2){ ctx.moveTo(x+30,y+3); ctx.lineTo(x+24,y+10); ctx.lineTo(x+32,y+17); }
    ctx.stroke();
  }
  if(cell.flash>0){ ctx.fillStyle="rgba(255,255,255,.5)"; roundRect(x+1,y+1,BW-2,BH-2,rr); ctx.fill(); }
  if(lastSpurt){ ctx.fillStyle="rgba(255,230,120,"+(0.25+0.2*Math.sin(timeSec*8))+")"; roundRect(x+1,y+1,BW-2,BH-2,rr); ctx.fill(); }
}

function drawSoilCell(cell, r, c, x, y){
  if(stage().theme==="ground") return drawCargoCell(cell, r, c, x, y);
  const t = cell.t, sd = cell.seed, d = r/(ROWS-1);
  if(t===3){ // 石：ごつごつした丸い岩
    ctx.fillStyle="#6f7378"; roundRect(x+1,y+1,BW-2,BH-2,6); ctx.fill();
    const g=ctx.createLinearGradient(x,y,x+BW,y+BH); g.addColorStop(0,"#b3b8bd"); g.addColorStop(1,"#7d8287");
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(x+6,y+4); ctx.lineTo(x+BW-7,y+3); ctx.lineTo(x+BW-3,y+BH*0.5); ctx.lineTo(x+BW-8,y+BH-3); ctx.lineTo(x+8,y+BH-3); ctx.lineTo(x+3,y+BH*0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.moveTo(x+9,y+6); ctx.lineTo(x+20,y+5); ctx.lineTo(x+14,y+10); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath(); ctx.moveTo(x+12,y+BH-5); ctx.lineTo(x+BW-9,y+BH-5); ctx.lineTo(x+BW-5,y+BH*0.5); ctx.lineTo(x+26,y+12); ctx.closePath(); ctx.fill();
  }else if(t===2){ // かたい土：赤茶の粘土、ひび模様
    const g=ctx.createLinearGradient(0,y,0,y+BH); g.addColorStop(0,mix("#a8603a","#8a4a2c",d)); g.addColorStop(1,mix("#7e4326","#5f3119",d));
    ctx.fillStyle=g; roundRect(x+1,y+1,BW-2,BH-2,5); ctx.fill();
    ctx.strokeStyle="rgba(60,25,10,.5)"; ctx.lineWidth=1.5; roundRect(x+1.5,y+1.5,BW-3,BH-3,5); ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.14)"; roundRect(x+3,y+2.5,BW-6,4,2); ctx.fill();
    ctx.strokeStyle="rgba(40,15,5,.35)"; ctx.lineWidth=1; ctx.beginPath();
    ctx.moveTo(x+6+hash(sd,1)*6,y+6); ctx.lineTo(x+13+hash(sd,2)*6,y+12); ctx.lineTo(x+10,y+BH-4);
    ctx.moveTo(x+24+hash(sd,3)*6,y+5); ctx.lineTo(x+22,y+11+hash(sd,4)*4); ctx.lineTo(x+30,y+BH-5); ctx.stroke();
  }else{ // やわらか土（荷物入りも同じ）：ふかふかの茶色、つぶつぶ
    const g=ctx.createLinearGradient(0,y,0,y+BH); g.addColorStop(0,mix("#d59a66","#b57a4e",d)); g.addColorStop(1,mix("#b27a4f","#8f5c39",d));
    ctx.fillStyle=g; roundRect(x+1,y+1,BW-2,BH-2,6); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.2)"; roundRect(x+3,y+2.5,BW-6,4,2); ctx.fill();
    ctx.fillStyle="rgba(90,50,20,.28)";
    for(let k=0;k<4;k++){ ctx.beginPath(); ctx.arc(x+5+hash(sd,k)*(BW-10), y+6+hash(sd,k+9)*(BH-11), 1.2+hash(sd,k+20)*1.2, 0, 6.28); ctx.fill(); }
    ctx.fillStyle="rgba(255,235,200,.35)";
    for(let k=0;k<2;k++){ ctx.beginPath(); ctx.arc(x+6+hash(sd,k+30)*(BW-12), y+7+hash(sd,k+40)*(BH-12), 1.1, 0, 6.28); ctx.fill(); }
    if(t===5) drawImg(DIMG.kozutsumi, x+BW/2, y+BH/2+1, BH-4, 0);
  }
  ctx.strokeStyle="rgba(0,0,0,.22)"; ctx.lineWidth=1; roundRect(x+.5,y+.5,BW-1,BH-1,6); ctx.stroke();
  if((t===2||t===3) && cell.hp < HP[t]){
    ctx.strokeStyle="rgba(20,8,0,.8)"; ctx.lineWidth=1.8; ctx.beginPath();
    ctx.moveTo(x+8,y+4); ctx.lineTo(x+16,y+11); ctx.lineTo(x+13,y+18);
    if(HP[t]-cell.hp>=2){ ctx.moveTo(x+30,y+3); ctx.lineTo(x+24,y+10); ctx.lineTo(x+32,y+17); }
    ctx.stroke();
  }
  if(cell.flash>0){ ctx.fillStyle="rgba(255,255,255,.5)"; roundRect(x+1,y+1,BW-2,BH-2,5); ctx.fill(); }
  if(lastSpurt){ ctx.fillStyle="rgba(255,230,120,"+(0.25+0.2*Math.sin(timeSec*8))+")"; roundRect(x+1,y+1,BW-2,BH-2,5); ctx.fill(); }
}

function drawDrop(d){
  const x = d.x + Math.sin(d.wob)*4, y = d.y, k = d.kind.k;
  const h = (k==="kasa"||k==="heart") ? 34 : 42;
  ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=6; ctx.shadowOffsetY=3;
  drawImg(DIMG[k], x, y, h, k==="shojo" ? Math.sin(d.wob)*0.2 : 0);
  ctx.shadowColor="transparent"; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  ctx.fillStyle = d.kind.good ? "rgba(255,255,255,.9)" : "rgba(255,120,120,.95)";
  ctx.font="bold 10px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText(d.kind.label, x, y+h/2+2);
}

function drawBallShape(R, gold){ // 手毬
  const base = gold ? "#ffd23a" : "#5ed3cf", dark = gold ? "#b8860b" : "#17494f", light="#ffffff";
  ctx.beginPath(); ctx.arc(0,0,R,0,6.28); ctx.fillStyle=base; ctx.fill();
  ctx.save(); ctx.clip();
  { // 帯が交差
    ctx.lineWidth=R*0.28; ctx.strokeStyle=light;
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.42,0.6,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.42,-0.6,0,6.28); ctx.stroke();
    ctx.lineWidth=R*0.12; ctx.strokeStyle=dark;
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.42,0.6,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,R,R*0.42,-0.6,0,6.28); ctx.stroke();
    ctx.fillStyle="#ff6b8a"; ctx.beginPath(); ctx.arc(0,0,R*0.2,0,6.28); ctx.fill();
  }
  ctx.restore();
  // 陰とハイライト
  const sh=ctx.createRadialGradient(-R*0.35,-R*0.35,R*0.1,0,0,R); sh.addColorStop(0,"rgba(255,255,255,.55)"); sh.addColorStop(0.5,"rgba(255,255,255,0)"); sh.addColorStop(1,"rgba(0,0,0,.28)");
  ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(0,0,R,0,6.28); ctx.fill();
  ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(0,0,R-0.5,0,6.28); ctx.stroke();
}
function drawBall(b){
  b.trail.forEach((t,i)=>{ ctx.globalAlpha=(i+1)/b.trail.length*0.18; ctx.fillStyle="#9fe3f2";
    ctx.beginPath(); ctx.arc(t.x,t.y,BALL_R*(i+1)/b.trail.length,0,6.28); ctx.fill(); });
  ctx.globalAlpha=1;
  if(drillT>0){ ctx.fillStyle="rgba(255,210,58,.5)"; ctx.beginPath(); ctx.arc(b.x,b.y,BALL_R+5,0,6.28); ctx.fill(); }
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
  drawBallShape(BALL_R, drillT>0);
  ctx.restore();
}

function drawMole(){
  const x = paddle.x, y = PADDLE_Y;
  let face = paddle.face;
  if(state==="clear") face="joy"; else if(state==="over") face="cry";
  const img = IMG[face] || IMG.normal, meta = MOGURA_IMG[face] || MOGURA_IMG.normal;
  // 棒の長さ＝受ける幅。のびる／ちぢむ はもぐらごと大きく／小さく
  const pw = paddleW();
  const sc = pw / meta.w;
  const dw = meta.w*sc, dh = meta.h*sc;
  const dip = paddle.faceT>0 && face==="hit" ? 4*(paddle.faceT/0.25) : 0;
  const wob = paddle.slipT>0 ? Math.sin(timeSec*14)*3 : 0;
  // 棒の上面が y-6 に来るように置く
  const top = y - 6 - meta.top*sc + dip;
  if(paddle.freezeT>0){ ctx.fillStyle="rgba(120,200,255,.3)"; roundRect(x-dw/2-6, top-6, dw+12, dh, 12); ctx.fill(); }
  if(img && img.complete && img.naturalWidth) ctx.drawImage(img, x-dw/2+wob, top, dw, dh);
  // 絵にない小さな演出
  if(face==="surprise"){ ctx.fillStyle="#e63946"; ctx.font="bold 26px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillText("！", x, top-6); }
  if(face==="oops"){ ctx.fillStyle="#7fd3e8"; for(const d of [-1,1]){ ctx.beginPath(); ctx.ellipse(x+d*(dw/2-6), top+40+Math.sin(timeSec*20)*3, 3, 5, 0, 0, 6.28); ctx.fill(); } }
  if(paddle.freezeT>0){ ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="center"; ctx.fillText("かたまった…", x, top+dh*0.62); }
}

function draw(){
  const s = scale*dpr;
  ctx.setTransform(s,0,0,s,0,0);
  ctx.clearRect(0,0,W,H+HUD);

  // 表示帯
  ctx.fillStyle = "#3d2a19"; ctx.fillRect(0,0,W,HUD);
  ctx.fillStyle = "#f6ead2"; ctx.font = "bold 16px sans-serif"; ctx.textBaseline = "middle";
  if(state==="title"){ ctx.textAlign="center"; ctx.fillText("ハセガワ産業 ・ SAGASEL あそびば", W/2, HUD/2); ctx.save(); ctx.translate(0,HUD); drawSky(PADDLE_Y+100,true); hikTitle(); drawMole(); ctx.restore(); return; }
  ctx.textAlign = "left"; ctx.fillText("のこり", 12, HUD/2);
  for(let i=0;i<3;i++){ ctx.globalAlpha = i<lives?1:0.2; ctx.fillStyle="#1fb5b0"; ctx.beginPath(); ctx.arc(70+i*20, HUD/2, 7, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.textAlign="center"; ctx.fillStyle="#f6ead2"; ctx.fillText(stage().no + "面　のこり " + remaining() + " マス", W/2, HUD/2);
  ctx.textAlign="right"; ctx.fillText(fmtTime(timeSec), W-12, HUD/2);

  ctx.save(); ctx.translate(0, HUD);
  if(shake>0) ctx.translate((Math.random()*2-1)*shake, (Math.random()*2-1)*shake);
  ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();

  if(state==="title"){ // 表紙：風景ともぐらだけ
    drawSky(PADDLE_Y+100, true);
    titleT += 1/60; hikTitle();
    drawMole(); ctx.restore(); return;
  }
  if(state==="crumble"){ drawCrumble(); ctx.restore(); return; }

  if(stage().theme==="ground"){ drawSky(PADDLE_Y+100, true); drawShelf(); }
  else { drawSky(SKY, false); drawUnderground(); }

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const cell=grid[r][c]; if(cell.t) drawSoilCell(cell, r, c, c*BW, SOIL_TOP+r*BH); }

  for(const d of drops) drawDrop(d);
  for(const p of parts){ ctx.globalAlpha=Math.min(1,p.life*2); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
  ctx.globalAlpha=1;
  for(const b of balls) drawBall(b);
  drawMole();

  if(state==="play" && balls.some(b=>b.held)){
    ctx.font="bold 15px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.strokeStyle="rgba(40,25,10,.7)"; ctx.lineWidth=4; ctx.strokeText("クリック（タップ）で打ち出す", W/2, PADDLE_Y - 60);
    ctx.fillStyle="rgba(246,234,210,.95)"; ctx.fillText("クリック（タップ）で打ち出す", W/2, PADDLE_Y - 60);
  }
  if(msgTimer>0){
    ctx.globalAlpha=Math.min(1,msgTimer*2); ctx.fillStyle="#fff"; ctx.strokeStyle="#3a2a1a"; ctx.lineWidth=4;
    ctx.font="bold 24px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    const y = PADDLE_Y - 100 - (1.1-msgTimer)*20;
    ctx.strokeText(msgText, W/2, y); ctx.fillText(msgText, W/2, y); ctx.globalAlpha=1;
  }
  ctx.font="bold 12px sans-serif"; ctx.textAlign="right"; ctx.textBaseline="alphabetic"; ctx.fillStyle="#f6ead2";
  let ly = H - 12;
  const eff = [["のびる",paddle.wideT],["ちぢむ",paddle.shortT],["ぬるぬる",paddle.slipT],["ゆっくり",slowT],["ドリル",drillT]];
  ctx.strokeStyle="rgba(40,25,10,.7)"; ctx.lineWidth=3;
  for(const [n,t] of eff) if(t>0){ ctx.strokeText(n+" "+Math.ceil(t), W-8, ly); ctx.fillText(n+" "+Math.ceil(t), W-8, ly); ly -= 16; }
  ctx.restore();
}

/* ===== ループ ===== */
function loop(ts){
  if(lastTs==null) lastTs = ts;
  let dt = (ts - lastTs)/1000; lastTs = ts; if(dt > 0.05) dt = 0.05;
  update(dt);
  if(state!=="play"){
    for(const p of parts){
      if(p.confetti){ p.life -= dt*0.4; p.vy = Math.min(p.vy + 30*dt, 90); p.x += p.vx*dt + Math.sin(ts/300+p.y)*0.3; p.y += p.vy*dt; }
      else { p.life -= dt; p.vy += 520*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
    }
    parts = parts.filter(p=>p.life>0);
    shake = Math.max(0, shake - dt*18);
    if(state==="title") timeSec += dt; // 表紙は風景を動かし続ける
  }
  if(grid) draw();
  requestAnimationFrame(loop);
}
let crumbleT = 0;
function start(idx){
  audio();
  const from = stage().theme, to = (typeof idx === "number") ? STAGES[idx].theme : from;
  ["titleOv","clearOv","overOv"].forEach(id=>document.getElementById(id).classList.add("hide"));
  if(typeof idx === "number" && from==="under" && to==="ground" && state==="clear"){
    // 地表が崩れて地上へ
    stageIdx = idx; crumbleT = 0; state = "crumble"; shake = 3; SE.hard(); parts = [];
    return;
  }
  if(typeof idx === "number") stageIdx = idx;
  reset();
}
function drawCrumble(){
  const dt = 1/60; crumbleT += dt;
  // 1.6秒：地表の帯（草と地表の風景）がひび割れて落ちる → 明るい空へ
  const k = Math.min(1, crumbleT/1.6);
  drawSky(PADDLE_Y+100, true);             // 下に見える地上
  // 落ちていく「地中の画面」：全体が下へずれ、割れて消える
  const drop = k*k*(H+100);
  ctx.save(); ctx.translate(0, drop); ctx.globalAlpha = 1-k*0.6;
  drawSky(SKY,false); drawUnderground();
  ctx.restore(); ctx.globalAlpha=1;
  if(crumbleT < 0.9 && Math.random()<0.6) parts.push({x:Math.random()*W, y:SKY-12+Math.random()*20+drop, vx:(Math.random()*2-1)*120, vy:-Math.random()*200, life:0.9, size:3+Math.random()*4, color:Math.random()<0.5?"#7ccd5a":"#8f5c39"});
  shake = Math.max(0, 4*(1-k));
  ctx.fillStyle="#fff"; ctx.strokeStyle="#3a2a1a"; ctx.lineWidth=5; ctx.font="bold 28px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  if(k>0.3){ ctx.strokeText("地上に出た！", W/2, 300); ctx.fillText("地上に出た！", W/2, 300); }
  drawMole();
  if(crumbleT >= 2.0){ reset(); }
}
function showTitle(){
  ["clearOv","overOv"].forEach(id=>document.getElementById(id).classList.add("hide"));
  buildStageBtns(); document.getElementById("titleOv").classList.remove("hide");
  stageIdx = 0; reset(); state = "title";
}
let chosen = 0;
function buildStageBtns(){
  const box = document.getElementById("stageBtns"); box.innerHTML = "";
  const u = unlocked();
  chosen = Math.min(chosen, u-1);
  STAGES.forEach((st,i)=>{
    const b = document.createElement("button");
    b.textContent = st.no + "面 " + st.name;
    if(i >= u) b.classList.add("lock"); else b.onclick = ()=>{ chosen = i; buildStageBtns(); };
    if(i === chosen) b.classList.add("cur");
    box.appendChild(b);
  });
  document.getElementById("startBtn").textContent = STAGES[chosen].no + "面から はじめる";
}
document.getElementById("startBtn").onclick = ()=>start(chosen);
document.getElementById("againBtn1").onclick = ()=>start();
document.getElementById("againBtn2").onclick = ()=>start();
document.getElementById("nextBtn").onclick = ()=>start(Math.min(stageIdx+1, STAGES.length-1));
document.getElementById("titleBtn").onclick = showTitle;
buildStageBtns();
reset(); state = "title";
requestAnimationFrame(loop);

window.__game = { get state(){return state;}, get balls(){return balls;}, get grid(){return grid;}, get drops(){return drops;},
  get paddle(){return paddle;}, start, launch, catchDrop, DROPS, SOIL_TOP, SOIL_BOTTOM,
  _test:{ pickDrop, setLives(n){lives=n;}, resetCount(){itemsOpened=0; heartGiven=0;} } };
})();
</script>
